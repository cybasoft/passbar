name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: PGPBridge/go.mod
      - name: Build PGP bridge (runs Go tests)
        run: ./scripts/build-pgp.sh
      - name: Swift tests
        run: swift test
      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project PassBar.xcodeproj -scheme PassBar -configuration Debug \
            -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
